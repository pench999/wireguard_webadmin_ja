{% extends base_template %}
{% load crispy_forms_tags %}
{% load i18n %}

{% block content %}
<div class="mfa-shell">
    <div class="mfa-card">
        <div class="mfa-card-header">
            <h1>{% trans 'パスワード変更' %}</h1>
            <p>{% trans 'VPNポータルへログインするためのパスワードを変更します。' %}</p>
        </div>
        <form method="post">
            {% csrf_token %}
            {% crispy form %}
        </form>
    </div>
</div>
{% endblock %}
